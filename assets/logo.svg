<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mapleGrad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="50%" stop-color="#FB8500"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="60" y1="10" x2="60" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="stormGlow" cx="60" cy="60" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB8500" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0B12" stop-opacity="0"/>
    </radialGradient>
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FB8500" flood-opacity="0.6"/>
    </filter>
    <filter id="lightningGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background Ambient Aura -->
  <circle cx="60" cy="60" r="52" fill="url(#stormGlow)"/>
  
  <!-- Left Autumn Leaf Wings -->
  <path d="M 46 22 L 20 40 L 32 58 L 14 74 L 46 98 L 46 80 L 30 68 L 46 52 Z" fill="url(#mapleGrad)" filter="url(#cleanGlow)"/>
  
  <!-- Right Autumn Leaf Wings -->
  <path d="M 74 22 L 100 40 L 88 58 L 106 74 L 74 98 L 74 80 L 90 68 L 74 52 Z" fill="url(#mapleGrad)" filter="url(#cleanGlow)"/>
  
  <!-- Central Electric Lightning Blade -->
  <path d="M 65 10 L 42 56 L 58 56 L 48 110 L 78 50 L 62 50 Z" fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" filter="url(#lightningGlow)"/>
  
  <!-- Energy Core Center -->
  <circle cx="60" cy="53" r="4.5" fill="#FFFFFF"/>
</svg>
